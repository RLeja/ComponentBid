<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Auction Details</title>
    <link rel="stylesheet" th:href="@{/styles.css}">
</head>
<body>

<main class="app-shell">
    <header class="topbar">
        <a class="brand" th:href="@{/}">
            <span class="brand-mark">CB</span>
            <span>ComponentBid</span>
        </a>
        <nav class="nav-actions">
            <a class="button secondary" th:href="@{/}">Back to Auctions</a>
        </nav>
    </header>

    <div class="alert alert-success"
         th:if="${successMessage}"
         th:text="${successMessage}">
    </div>

    <div class="alert alert-error"
         th:if="${errorMessage}"
         th:text="${errorMessage}">
    </div>

    <section class="details-layout">
        <article class="panel">
            <p class="eyebrow">Auction details</p>
            <h1 th:text="${auction.title}"></h1>

            <div class="image-grid">
                <img class="auction-image"
                     th:each="imageUrl : ${auction.imageUrls}"
                     th:src="@{${imageUrl}}"
                     alt="Auction image">
            </div>

            <div class="detail-list">
                <p>
                    <span class="meta-label">Description</span>
                    <span th:text="${auction.description}"></span>
                </p>

                <div class="meta-grid">
                    <p class="meta-item">
                        <span class="meta-label">Category</span>
                        <span class="meta-value" th:text="${auction.categoryName}"></span>
                    </p>

                    <p class="meta-item">
                        <span class="meta-label">Manufacturer</span>
                        <span class="meta-value" th:text="${auction.manufacturerName}"></span>
                    </p>

                    <p class="meta-item">
                        <span class="meta-label">Condition</span>
                        <span class="meta-value" th:text="${auction.conditionName}"></span>
                    </p>

                    <p class="meta-item">
                        <span class="meta-label">Price</span>
                        <span class="meta-value" th:text="${auction.startPrice}"></span>
                    </p>
                </div>

                <p>
                    <span class="meta-label">Seller</span>
                    <a th:href="@{/users/{id}(id=${auction.seller.id})}"
                       th:text="${auction.seller.name}">
                    </a>
                </p>

                <div class="meta-grid">
                    <p class="meta-item">
                        <span class="meta-label">Starts at</span>
                        <span class="meta-value" th:text="${#temporals.format(auction.startDate, 'dd.MM.yyyy HH:mm')}"></span>
                    </p>

                    <p class="meta-item">
                        <span class="meta-label">Ends at</span>
                        <span class="meta-value" th:text="${#temporals.format(auction.endDate, 'dd.MM.yyyy HH:mm')}"></span>
                    </p>
                </div>
            </div>
        </article>

        <aside class="panel">
            <span class="status-pill" th:if="${auction.active}">Bidding open</span>
            <span class="status-pill" th:unless="${auction.active}">Bidding closed</span>

            <div th:if="${auction.active}" sec:authorize="isAuthenticated()">
                <h2>Place Bid</h2>

                <form class="form-grid" th:action="@{/auctions/{id}/bids(id=${auction.id})}"
                      th:object="${bidCreateRequest}"
                      method="post">

                    <label class="span-2" for="sum">
                        Bid Sum
                        <input
                                id="sum"
                                type="number"
                                step="0.01"
                                min="0.01"
                                th:field="*{sum}"
                                th:errorclass="input-error"
                                required>
                        <span class="field-error"
                              th:if="${#fields.hasErrors('sum')}"
                              th:errors="*{sum}">
                        </span>
                    </label>

                    <button class="span-2" type="submit">
                        Place Bid
                    </button>

                </form>
            </div>

            <div th:if="${canReview}" sec:authorize="isAuthenticated()">
                <h3>Review Seller</h3>

                <form class="form-grid" th:action="@{/auctions/{id}/reviews(id=${auction.id})}"
                      th:object="${reviewCreateRequest}"
                      method="post">

                    <label class="span-2" for="rating">
                        Rating
                        <input id="rating"
                               type="number"
                               min="1"
                               max="5"
                               th:field="*{rating}"
                               th:errorclass="input-error"
                               required>
                        <span class="field-error"
                              th:if="${#fields.hasErrors('rating')}"
                              th:errors="*{rating}">
                        </span>
                    </label>

                    <label class="span-2" for="comment">
                        Comment
                        <textarea id="comment"
                                  th:field="*{comment}"
                                  th:errorclass="input-error">
                        </textarea>
                        <span class="field-error"
                              th:if="${#fields.hasErrors('comment')}"
                              th:errors="*{comment}">
                        </span>
                    </label>

                    <button class="span-2" type="submit">
                        Submit Review
                    </button>

                </form>
            </div>
        </aside>
    </section>

    <h2>Bid History</h2>

    <div class="table-wrap">
        <table>
            <tr>
                <th>Bidder</th>
                <th>Amount</th>
                <th>Time</th>
            </tr>

            <tr th:each="bid : ${bids}">
                <td>
                    <a th:href="@{/users/{id}(id=${bid.bidder.id})}"
                       th:text="${bid.bidder.name}">
                    </a>
                </td>
                <td th:text="${bid.sum}"></td>
                <td th:text="${#temporals.format(bid.createdAt, 'dd.MM.yyyy HH:mm')}"></td>
            </tr>
        </table>
    </div>
</main>

</body>
</html>
