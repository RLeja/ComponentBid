<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Auction</title>
    <link rel="stylesheet" th:href="@{/styles.css}">
</head>
<body>

<main class="app-shell">
    <header class="topbar">
        <a class="brand" th:href="@{/}">
            <span class="brand-mark">CB</span>
            <span>ComponentBid</span>
        </a>
        <nav class="nav-actions">
            <a class="button secondary" th:href="@{/auctions/{id}(id=${auctionId})}">Back to Auction</a>
        </nav>
    </header>

    <section class="hero">
        <p class="eyebrow">Edit listing</p>
        <h1>Edit Auction</h1>
        <p>Update the component details and auction dates.</p>
    </section>

    <div class="alert alert-error"
         th:if="${errorMessage}"
         th:text="${errorMessage}">
    </div>

    <form class="panel form-grid"
          th:action="@{/auctions/{id}/edit(id=${auctionId})}"
          th:object="${auction}"
          enctype="multipart/form-data"
          method="post">

        <label for="title">
            Title
            <input id="title"
                   type="text"
                   th:field="*{title}"
                   th:errorclass="input-error"
                   required>
            <span class="field-error"
                  th:if="${#fields.hasErrors('title')}"
                  th:errors="*{title}">
            </span>
        </label>

        <label for="startPrice">
            Starting Price
            <input id="startPrice"
                   type="number"
                   step="0.01"
                   min="0.01"
                   th:field="*{startPrice}"
                   th:errorclass="input-error"
                   required>
            <span class="field-error"
                  th:if="${#fields.hasErrors('startPrice')}"
                  th:errors="*{startPrice}">
            </span>
        </label>

        <label class="span-2" for="desc">
            Description
            <textarea id="desc"
                      th:field="*{description}"
                      th:errorclass="input-error">
            </textarea>
            <span class="field-error"
                  th:if="${#fields.hasErrors('description')}"
                  th:errors="*{description}">
            </span>
        </label>

        <label for="category">
            Category
            <select id="category"
                    th:field="*{categoryId}"
                    th:errorclass="input-error">
                <option value="">Select Category</option>
                <option th:each="category : ${categories}"
                        th:value="${category.id}"
                        th:text="${category.name}">
                </option>
            </select>
            <span class="field-error"
                  th:if="${#fields.hasErrors('categoryId')}"
                  th:errors="*{categoryId}">
            </span>
        </label>

        <label for="manufacturer">
            Manufacturer
            <select id="manufacturer"
                    th:field="*{manufacturerId}"
                    th:errorclass="input-error">
                <option value="">Select Manufacturer</option>
                <option th:each="manufacturer : ${manufacturers}"
                        th:value="${manufacturer.id}"
                        th:text="${manufacturer.name}">
                </option>
            </select>
            <span class="field-error"
                  th:if="${#fields.hasErrors('manufacturerId')}"
                  th:errors="*{manufacturerId}">
            </span>
        </label>

        <label for="condition">
            Condition
            <select id="condition"
                    th:field="*{conditionId}"
                    th:errorclass="input-error">
                <option value="">Select Condition</option>
                <option th:each="condition : ${conditions}"
                        th:value="${condition.id}"
                        th:text="${condition.name}">
                </option>
            </select>
            <span class="field-error"
                  th:if="${#fields.hasErrors('conditionId')}"
                  th:errors="*{conditionId}">
            </span>
        </label>

        <label for="start">
            Start Date
            <input id="start"
                   type="datetime-local"
                   th:field="*{startDate}"
                   th:errorclass="input-error"
                   required>
            <span class="field-error"
                  th:if="${#fields.hasErrors('startDate')}"
                  th:errors="*{startDate}">
            </span>
        </label>

        <label for="end">
            End Date
            <input id="end"
                   type="datetime-local"
                   th:field="*{endDate}"
                   th:errorclass="input-error"
                   required>
            <span class="field-error"
                  th:if="${#fields.hasErrors('endDate')}"
                  th:errors="*{endDate}">
            </span>
        </label>

        <div class="span-2">
            <button type="submit">Save Changes</button>
        </div>

    </form>
</main>

</body>
</html>
