<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Change Password</title>
    <link rel="stylesheet" th:href="@{/styles.css}">
</head>
<body>
<main class="app-shell">
    <header class="topbar">
        <a class="brand" th:href="@{/}">
            <span class="brand-mark">CB</span>
            <span>ComponentBid</span>
        </a>
        <nav class="nav-actions">
            <a class="button secondary" th:href="@{/users/profile}">Back to Profile</a>
        </nav>
    </header>

    <section class="hero">
        <p class="eyebrow">Account settings</p>
        <h1>Change Password</h1>
        <p>Enter your current password and choose a new one.</p>
    </section>

    <div class="alert alert-error"
         th:if="${errorMessage}"
         th:text="${errorMessage}">
    </div>

    <form class="panel form-grid"
          th:action="@{/users/profile/change-password}"
          th:object="${changePasswordRequest}"
          method="post">

        <label class="span-2" for="currentPassword">
            Current Password
            <input id="currentPassword"
                   type="password"
                   th:field="*{currentPassword}"
                   th:errorclass="input-error"
                   required>
            <span class="field-error"
                  th:if="${#fields.hasErrors('currentPassword')}"
                  th:errors="*{currentPassword}">
            </span>
        </label>

        <label class="span-2" for="newPassword">
            New Password
            <input id="newPassword"
                   type="password"
                   th:field="*{newPassword}"
                   th:errorclass="input-error"
                   required>
            <span class="field-error"
                  th:if="${#fields.hasErrors('newPassword')}"
                  th:errors="*{newPassword}">
            </span>
        </label>

        <div class="span-2 nav-actions">
            <button type="submit">Change Password</button>
            <a class="button secondary" th:href="@{/users/profile}">Cancel</a>
        </div>

    </form>
</main>
</body>
</html>
