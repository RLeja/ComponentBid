<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>User Profile</title>
    <link rel="stylesheet" th:href="@{/styles.css}">
</head>
<body>
<main class="app-shell">
    <header class="topbar">
        <a class="brand" th:href="@{/}">
            <span class="brand-mark">CB</span>
            <span>ComponentBid</span>
        </a>
        <nav class="nav-actions">
            <a class="button" th:if="${isOwnProfile}" th:href="@{/users/profile/edit}">Edit Profile</a>
            <a class="button" th:if="${isOwnProfile}" th:href="@{/users/profile/change-password}">Change Password</a>
            <form th:if="${isOwnProfile}" th:action="@{/users/profile/delete}" method="post">
                <button type="submit">Delete Account</button>
            </form>
<!--            <div th:if="${!isOwnProfile}" sec:authorize="hasRole('ADMIN')">-->
<!--                <form th:action="@{/users/{id}/ban(id=${profile.id})}" method="post">-->
<!--                    <button type="submit">Ban User</button>-->
<!--                </form>-->
<!--            </div>-->
            <a class="button secondary" th:href="@{/}">Back to Auctions</a>
        </nav>

    </header>

    <div class="alert alert-success"
         th:if="${successMessage}"
         th:text="${successMessage}">
    </div>

    <section class="panel profile-header">
        <img class="profile-picture"
             th:src="@{https://ui-avatars.com/api/(name=${profile.name},background='2563eb',color='ffffff',size='224')}"
             th:alt="${profile.name + ' profile picture'}">

        <div>
            <p class="eyebrow">User profile</p>
            <h1 th:text="${profile.name}"></h1>

            <div class="meta-grid">
                <p class="meta-item">
                    <span class="meta-label">Rating</span>
                    <span class="meta-value" th:text="${profile.averageRating}"></span>
                </p>

                <p class="meta-item">
                    <span class="meta-label">Email</span>
                    <span class="meta-value" th:text="${profile.email}"></span>
                </p>
            </div>
        </div>
    </section>

    <h2>Created Auctions</h2>

    <div class="table-wrap">
        <table>
            <tr>
                <th>Picture</th>
                <th>Title</th>
                <th>Status</th>
            </tr>

            <tr th:each="auction : ${profile.auctions}">
                <td>
                    <img class="auction-picture"
                         th:src="${auction.imageUrl != null ? auction.imageUrl : 'https://placehold.co/192x144/e5e7eb/475569?text=No+image'}"
                         th:alt="${auction.title + ' picture'}"
                         onerror="this.src='https://placehold.co/192x144/e5e7eb/475569?text=No+image'">
                </td>
                <td>
                    <a th:href="@{/auctions/{id}(id=${auction.id})}"
                       th:text="${auction.title}">
                    </a>
                </td>
                <td th:text="${auction.currentStatus}">
                </td>
            </tr>
        </table>
    </div>

    <h2>Bids</h2>

    <div class="table-wrap">
        <table>
            <tr>
                <th>Picture</th>
                <th>Auction</th>
                <th>Time</th>
                <th>Sum</th>
            </tr>

            <tr th:each="bid : ${profile.bids}">
                <td>
                    <a class="auction-link"
                       th:href="@{/auctions/{id}(id=${bid.auction.id})}">
                        <img class="auction-picture"
                             th:src="${bid.auction.imageUrl != null ? bid.auction.imageUrl : 'https://placehold.co/192x144/e5e7eb/475569?text=No+image'}"
                             th:alt="${bid.auction.title + ' picture'}"
                             onerror="this.src='https://placehold.co/192x144/e5e7eb/475569?text=No+image'">
                    </a>
                </td>
                <td>
                    <a th:href="@{/auctions/{id}(id=${bid.auction.id})}"
                       th:text="${bid.auction.title}">
                    </a>
                </td>
                <td th:text="${#temporals.format(bid.createdAt, 'dd.MM.yyyy HH:mm')}">
                </td>
                <td th:text="${bid.sum}">
                </td>
            </tr>
        </table>
    </div>

    <h2>Written Reviews</h2>

    <section class="review-grid">
        <article class="review-card" th:each="wReview : ${profile.writtenReviews}">
            <p>
                <span class="meta-label">For</span>
                <a th:href="@{/users/{id}(id=${wReview.seller.id})}"
                   th:text="${wReview.seller.name}">
                </a>
            </p>
            <p>
                <span class="meta-label">Rating</span>
                <span class="meta-value" th:text="${wReview.rating}"></span>
                <span class="muted">/ 5</span>
            </p>
            <p th:text="${wReview.comment}"></p>
        </article>
    </section>

    <h2>Received Reviews</h2>

    <section class="review-grid">
        <article class="review-card" th:each="rReview : ${profile.receivedReviews}">
            <p>
                <span class="meta-label">Rating</span>
                <span class="meta-value" th:text="${rReview.rating}"></span>
                <span class="muted">/ 5</span>
            </p>
            <p th:text="${rReview.comment}"></p>
        </article>
    </section>
</main>
</body>
</html>
