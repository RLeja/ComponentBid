<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <style>
        label,
        input {
            display: block;
            margin-top: 10px;
        }

        .alert {
            padding: 10px 12px;
            margin: 12px 0;
            border-radius: 6px;
        }

        .alert-error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .alert-success {
            background: #dcfce7;
            color: #166534;
            border: 1px solid #bbf7d0;
        }
    </style>
</head>
<body>
<div class="alert alert-success"
     th:if="${successMessage}"
     th:text="${successMessage}">
</div>

<div class="alert alert-success"
     th:if="${param.logout}">
    You have been logged out.
</div>

<div class="alert alert-error"
     th:if="${param.error}">
    Invalid email or password.
</div>

<form th:action="@{/login}"
      method="post">

    <label for="username">Username:</label>
    <input
            id="username"
            name="username"
            placeholder="Email">

    <label for="password">Password:</label>
    <input
            id="password"
            type="password"
            name="password"
            placeholder="Password">

    <button type="submit">
        Login
    </button>

</form>
</body>
</html>
