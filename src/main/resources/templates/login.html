<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
</head>
<body>
<form th:action="@{/login}"
      method="post">

    <label for="username">Username:</label>
    <input
            id="username"
            name="username"
            placeholder="Email">

    <label for="password">Password:</label>
    <input
            id="password"
            type="password"
            name="password"
            placeholder="Password">

    <button type="submit">
        Login
    </button>

</form>
</body>
</html>
