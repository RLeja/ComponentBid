<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
</head>
<body>
<form th:action="@{/register}"
      th:object="${registerRequest}"
      method="post">

    <label for="username">Username:</label>
    <input
            id="username"
            th:field="*{name}"
            placeholder="Name">

    <label for="email">Email:</label>
    <input
            id="email"
            th:field="*{email}"
            placeholder="Email">

    <label for="password">Password:</label>
    <input
            id="password"
            type="password"
            th:field="*{password}"
            placeholder="Password">

    <button type="submit">
        Register
    </button>

</form>
</body>
</html>
