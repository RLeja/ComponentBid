<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Auction Details</title>
</head>
<body>

<h1 th:text="${auction.title}"></h1>

<p>
    <strong>Description:</strong>
    <span th:text="${auction.description}"></span>
</p>

<p>
    <strong>Category:</strong>
    <span th:text="${auction.category.categoryName}"></span>
</p>

<p>
    <strong>Manufacturer:</strong>
    <span th:text="${auction.manufacturer.manufacturerName}"></span>
</p>

<p>
    <strong>Condition:</strong>
    <span th:text="${auction.condition.conditionName}"></span>
</p>

<p>
    <strong>Price:</strong>
    <span th:text="${auction.startPrice}"></span>
</p>

<p>
    <strong>Seller:</strong>
    <a th:href="@{/users/{id}(id=${auction.user.id})}"
       th:text="${auction.user.name}">
    </a>
</p>

<p>
    <strong>Starts at:</strong>
    <span th:text="${#temporals.format(auction.startDate, 'dd.MM.yyyy HH:mm')}"></span>
</p>

<p>
    <strong>Ends at:</strong>
    <span th:text="${#temporals.format(auction.endDate, 'dd.MM.yyyy HH:mm')}"></span>
</p>


<div th:if="${auction.active}" sec:authorize="isAuthenticated()">

    <h2>Place Bid</h2>

    <form th:action="@{/auctions/{id}/bids(id=${auction.id})}"
          th:object="${bidCreateRequest}"
          method="post">

        <label for="sum">Bid Sum</label>

        <input
                id="sum"
                type="number"
                step="0.01"
                th:field="*{sum}"
                required>

        <button type="submit">
            Place Bid
        </button>

    </form>

</div>


<div th:unless="${auction.active}">
    Bidding is closed.
</div>

<div th:if="${canReview}" sec:authorize="isAuthenticated()">

    <h3>Review Seller</h3>

    <form th:action="@{/auctions/{id}/reviews(id=${auction.id})}"
          method="post">

        <label for="rating">Rating</label>

        <input id="rating"
               type="number"
               min="0"
               max="5"
               name="rating"
               required>

        <label for="comment">Comment</label>

        <textarea id="comment" name="comment"></textarea>

        <button type="submit">
            Submit Review
        </button>

    </form>

</div>

<h2>Bid History</h2>

<table>
    <tr>
        <th>Bidder</th>
        <th>Amount</th>
        <th>Time</th>
    </tr>

    <tr th:each="bid : ${bids}">
        <td>
            <a th:href="@{/users/{id}(id=${bid.user.id})}"
               th:text="${bid.user.name}">
            </a>
        </td>
        <td th:text="${bid.sum}"></td>
        <td th:text="${#temporals.format(bid.createdAt, 'dd.MM.yyyy HH:mm')}"></td>
        <td th:text="${#temporals.format(bid.createdAt, 'dd.MM.yyyy HH:mm')}"></td>
    </tr>
</table>

<a th:href="@{/}">Back</a>

</body>
</html>
