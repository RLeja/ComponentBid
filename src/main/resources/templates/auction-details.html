<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Auction Details</title>
    <style>
        .alert {
            padding: 10px 12px;
            margin: 12px 0;
            border-radius: 6px;
        }

        .alert-error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .alert-success {
            background: #dcfce7;
            color: #166534;
            border: 1px solid #bbf7d0;
        }

        .field-error {
            color: #b91c1c;
            font-size: 0.9rem;
            margin-top: 4px;
        }

        .input-error {
            border: 1px solid #dc2626;
        }
    </style>
</head>
<body>

<div class="alert alert-success"
     th:if="${successMessage}"
     th:text="${successMessage}">
</div>

<div class="alert alert-error"
     th:if="${errorMessage}"
     th:text="${errorMessage}">
</div>

<h1 th:text="${auction.title}"></h1>

<img th:each="imageUrl : ${auction.imageUrls}"
     th:src="@{${imageUrl}}"
     style="max-width: 300px;"
     alt="bid-image">

<p>
    <strong>Description:</strong>
    <span th:text="${auction.description}"></span>
</p>

<p>
    <strong>Category:</strong>
    <span th:text="${auction.categoryName}"></span>
</p>

<p>
    <strong>Manufacturer:</strong>
    <span th:text="${auction.manufacturerName}"></span>
</p>

<p>
    <strong>Condition:</strong>
    <span th:text="${auction.conditionName}"></span>
</p>

<p>
    <strong>Price:</strong>
    <span th:text="${auction.startPrice}"></span>
</p>

<p>
    <strong>Seller:</strong>
    <a th:href="@{/users/{id}(id=${auction.seller.id})}"
       th:text="${auction.seller.name}">
    </a>
</p>

<p>
    <strong>Starts at:</strong>
    <span th:text="${#temporals.format(auction.startDate, 'dd.MM.yyyy HH:mm')}"></span>
</p>

<p>
    <strong>Ends at:</strong>
    <span th:text="${#temporals.format(auction.endDate, 'dd.MM.yyyy HH:mm')}"></span>
</p>


<div th:if="${auction.active}" sec:authorize="isAuthenticated()">

    <h2>Place Bid</h2>

    <form th:action="@{/auctions/{id}/bids(id=${auction.id})}"
          th:object="${bidCreateRequest}"
          method="post">

        <label for="sum">Bid Sum</label>

        <input
                id="sum"
                type="number"
                step="0.01"
                min="0.01"
                th:field="*{sum}"
                th:errorclass="input-error"
                required>
        <div class="field-error"
             th:if="${#fields.hasErrors('sum')}"
             th:errors="*{sum}">
        </div>

        <button type="submit">
            Place Bid
        </button>

    </form>

</div>


<div th:unless="${auction.active}">
    Bidding is closed.
</div>

<div th:if="${canReview}" sec:authorize="isAuthenticated()">

    <h3>Review Seller</h3>

    <form th:action="@{/auctions/{id}/reviews(id=${auction.id})}"
          th:object="${reviewCreateRequest}"
          method="post">

        <label for="rating">Rating</label>

        <input id="rating"
               type="number"
               min="1"
               max="5"
               th:field="*{rating}"
               th:errorclass="input-error"
               required>
        <div class="field-error"
             th:if="${#fields.hasErrors('rating')}"
             th:errors="*{rating}">
        </div>

        <label for="comment">Comment</label>

        <textarea id="comment"
                  th:field="*{comment}"
                  th:errorclass="input-error">
        </textarea>
        <div class="field-error"
             th:if="${#fields.hasErrors('comment')}"
             th:errors="*{comment}">
        </div>

        <button type="submit">
            Submit Review
        </button>

    </form>

</div>

<h2>Bid History</h2>

<table>
    <tr>
        <th>Bidder</th>
        <th>Amount</th>
        <th>Time</th>
    </tr>

    <tr th:each="bid : ${auction.bids}">
        <td>
            <a th:href="@{/users/{id}(id=${bid.bidder.id})}"
               th:text="${bid.bidder.name}">
            </a>
        </td>
        <td th:text="${bid.sum}"></td>
        <td th:text="${#temporals.format(bid.createdAt, 'dd.MM.yyyy HH:mm')}"></td>
        <td th:text="${#temporals.format(bid.createdAt, 'dd.MM.yyyy HH:mm')}"></td>
    </tr>
</table>

<a th:href="@{/}">Back</a>

</body>
</html>
