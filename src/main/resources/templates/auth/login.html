<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>
    <link rel="stylesheet" th:href="@{/styles.css}">
</head>
<body class="auth-page">
<main class="auth-panel">
    <a class="brand" th:href="@{/static}">
        <span class="brand-mark">CB</span>
        <span>ComponentBid</span>
    </a>

    <div class="alert alert-success"
         th:if="${successMessage}"
         th:text="${successMessage}">
    </div>

    <div class="alert alert-success"
         th:if="${param.logout}">
        You have been logged out.
    </div>

    <div class="alert alert-error"
         th:if="${param.error}">
        Invalid email or password.
    </div>

    <section class="hero">
        <p class="eyebrow">Welcome back</p>
        <h1>Login</h1>
    </section>

    <form class="form-grid" th:action="@{/login}"
          method="post">

        <label class="span-2" for="username">
            Email
            <input
                    id="username"
                    name="username"
                    placeholder="Email">
        </label>

        <label class="span-2" for="password">
            Password
            <input
                    id="password"
                    type="password"
                    name="password"
                    placeholder="Password">
        </label>

        <button class="full span-2" type="submit">
            Login
        </button>

    </form>
</main>
</body>
</html>
