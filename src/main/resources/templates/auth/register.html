<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register</title>
    <link rel="stylesheet" th:href="@{/styles.css}">
</head>
<body class="auth-page">
<main class="auth-panel">
    <a class="brand" th:href="@{/}">
        <span class="brand-mark">CB</span>
        <span>ComponentBid</span>
    </a>

    <div class="alert alert-error"
         th:if="${errorMessage}"
         th:text="${errorMessage}">
    </div>

    <section class="hero">
        <p class="eyebrow">Create account</p>
        <h1>Register</h1>
    </section>

    <form class="form-grid" th:action="@{/register}"
          th:object="${registerRequest}"
          method="post">

        <label class="span-2" for="username">
            Username
            <input
                    id="username"
                    th:field="*{name}"
                    th:errorclass="input-error"
                    placeholder="Name">
            <span class="field-error"
                  th:if="${#fields.hasErrors('name')}"
                  th:errors="*{name}">
            </span>
        </label>

        <label class="span-2" for="email">
            Email
            <input
                    id="email"
                    th:field="*{email}"
                    th:errorclass="input-error"
                    placeholder="Email">
            <span class="field-error"
                  th:if="${#fields.hasErrors('email')}"
                  th:errors="*{email}">
            </span>
        </label>

        <label class="span-2" for="password">
            Password
            <input
                    id="password"
                    type="password"
                    th:field="*{password}"
                    th:errorclass="input-error"
                    placeholder="Password">
            <span class="field-error"
                  th:if="${#fields.hasErrors('password')}"
                  th:errors="*{password}">
            </span>
        </label>

        <button class="full span-2" type="submit">
            Register
        </button>

    </form>
</main>
</body>
</html>
